schema: apex.competition.v1
id: humanoid_parkour
version: 0.2.0
display_name: "Humanoid Parkour"
kind: solo
process_type: cpu

resources:
  cpu_limit: 1
  mem_limit: 1.5Gi
  gpu_count: 0

# Built, pushed, and keyless-cosign-signed by this repo's release workflow (see
# .github/workflows/release.yml). `image` is the PLAYER image (loads + serves the miner's ONNX
# policy).
#
# Pinned from the v0.2.0 release run (Actions run 30641046057). Verified: pullable by digest,
# cosign keyless signature present, and the Fulcio cert's SAN is exactly the `cosign_identity`
# declared below at refs/tags/v0.2.0.
image:
  ref: ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-v2-player
  digest: sha256:0e83d1e9ad446e2f036cb63cbd4770afe59044fafb0b9254f5225247c1c47e51

# ONNX artifact: the miner submits a policy graph, not code. The player image
# validates the interface ([1,56] float32 in -> [1,17] float32 out) at load
# time; there is no code to screen and no Layer-2 screen image needed.
submission:
  artifact_type: onnx
  max_size_mb: 25
  target_path: /app/submission.onnx

screening:            # Layer-1 generic weights validator (onnx artifact_type)
  max_size_mb: 25
  min_weight_bytes: 10000        # rejects near-empty graphs / constant policies
  max_code_weight_ratio: 0.1

input_schema:
  $ref: ./input.schema.json

defaults:
  baseline_score: 0.0
  # Measured IN THE REFEREE IMAGE (not on a host — the two disagree by more than the 1%
  # takeover margin, see HANDOFF.md §4): mean over 20 master seeds at N=120 courses at this
  # round input (900-step cap, deadline_ms 500) with the released PPO baseline
  # (baseline/baseline.onnx, sha256 5e615c33…, ~110M steps — see baseline/PROVENANCE.md).
  # Per-seed numbers, config, and artifact digest: evidence/variance_baseline_N120_image.json.
  baseline_raw_score: 0.702
  round_length_in_days: 2
  submission_reveal_days: 5      # trained policies carry real R&D; protect them
  lower_is_better: false

entrypoints:
  # The PLAYER sandbox: serves the ONNX policy over gym_v1; the referee drives
  # it one observation at a time. timeout_s must cover the whole evaluation
  # (120 courses x <=900 control steps; measured ~15 s for the baseline,
  # ~6 min worst case for a policy surviving every step).
  evaluate:
    command: ["python", "/app/launch.py", "--port", "8000"]
    network_disabled: false   # the referee must reach the player on the per-job network
    allow_internet: false
    # Deliberately LONGER than referee.timeout_s (900): the player's clock starts earlier
    # (image start + readiness polling) and it must outlive the referee. If the player is
    # killed first, the referee's remaining courses score player_error — a zero the
    # submission did not earn.
    timeout_s: 1200
    http_api:
      port: 8000
      readiness_path: /health
      protocol: gym_v1

# The scorer sandbox: MuJoCo physics, course generation from the per-round
# SEED, termination gates, scoring. No generate_round entrypoint: the platform
# seed is enough (the referee derives all courses from it deterministically).
referee:
  protocol: gym_v1
  image:
    ref: ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-v2-referee
    digest: sha256:895114a0d7d0424ee7e756b0e5e772851f6f0787ecfa6000172f17dc9bf58b95
  timeout_s: 900

signature:
  cosign_identity: https://github.com/macrocosm-os/apex-competition-humanoid-parkour-v2/.github/workflows/release.yml
  cosign_issuer: https://token.actions.githubusercontent.com
