schema: apex.competition.v1
id: humanoid_parkour
version: 0.3.2
display_name: "Humanoid Parkour"
kind: solo
process_type: cpu

# Measured under these exact limits: referee peaks at 560 MiB (36% of 1.5Gi), player at 30 MiB.
# Referee memory does not scale with submission quality — a policy that survives longer runs more
# steps, and steps do not allocate — so this is close to the true ceiling, not a baseline figure
# that better solutions will grow into.
resources:
  cpu_limit: 1
  mem_limit: 1.5Gi
  gpu_count: 0

# Built, pushed, and keyless-cosign-signed by this repo's release workflow (see
# .github/workflows/release.yml). `image` is the PLAYER image (loads + serves the miner's ONNX
# policy).
#
# Digests are from the v0.3.1 release run and both images verify under the cosign identity
# below. The platform pins by digest and rejects tags.
image:
  ref: ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-v2-player
  digest: sha256:6bef0c40427d0208138b0706b81c867c2a491e338ba773925b4f936b014aff4b

# ONNX artifact: the miner submits a policy graph, not code. The player image validates the
# interface at load time (obs [batch,104] + state_in [batch,256] -> action [batch,12] +
# state_out [batch,256], all float32); there is no code to screen and no Layer-2 screen image.
#
# 25 MB, set against measurement rather than taste. Every Unitree reference locomotion policy
# (G1, H1, H1-2) is 0.13-0.14 MB, so this is ~180x the class of policy this task actually needs,
# and it still fits a 6-layer d=256 transformer over a history window (~5M params, ~20 MB).
#
# It is NOT a compute limit: measured single-threaded, a 5.5M-param net runs 0.35 ms/step, so a
# full-survival run (96,000 inferences) costs 34 s against ~640 s of slack in the referee budget.
# Even 74 MB would fit here. The cap exists because surplus capacity buys nothing on a
# proprioception + height-scan control problem, and because the evaluation suite is FIXED
# (env/sim.instance_spec) — spare parameters invite memorising 24 instances instead of learning
# to walk, and that risk scales with parameter count.
#
# The architecture itself is NOT constrained; only the tensor signature is.
submission:
  artifact_type: onnx
  max_size_mb: 25
  target_path: /app/submission.onnx

screening:            # Layer-1 generic weights validator (onnx artifact_type)
  max_size_mb: 25
  min_weight_bytes: 10000        # rejects near-empty graphs / constant policies
  max_code_weight_ratio: 0.1

input_schema:
  $ref: ./input.schema.json

defaults:
  baseline_score: 0.0
  # Measured IN THE REFEREE IMAGE ON NATIVE amd64 over the full 24-instance suite at this round
  # input, with the released stock-walker baseline (baseline/baseline.onnx — see
  # baseline/PROVENANCE.md). Exact value 0.20068353334086175.
  #
  # Both qualifiers are load-bearing. A host-side measurement gives 0.2006 and an arm64 build of
  # this same image gives 0.2004 — spreads of 0.04% and 0.12% against a 1% takeover margin. It is
  # measured by .github/workflows/measure-baseline.yml on a native amd64 runner, because published
  # images are amd64-only and under qemu a 24-instance suite does not finish in 15 hours.
  #
  # The evaluation suite is FIXED, not seeded per round (env/sim.instance_spec), so a given
  # policy reproduces this number exactly every round: round-to-round variance is zero and 1%
  # takeover is decided by skill rather than by noise.
  baseline_raw_score: 0.2007
  round_length_in_days: 2
  submission_reveal_days: 5      # trained policies carry real R&D; protect them
  lower_is_better: false

entrypoints:
  # The PLAYER sandbox: serves the ONNX policy over gym_v1; the referee drives it one
  # observation at a time. timeout_s must cover the whole evaluation (24 instances x <=4000
  # control steps): measured 67 s for the baseline, ~258 s for a policy that survives every step.
  evaluate:
    command: ["python", "/app/launch.py", "--port", "8000"]
    network_disabled: false   # the referee must reach the player on the per-job network
    allow_internet: false
    # Deliberately LONGER than referee.timeout_s (900): the player's clock starts earlier
    # (image start + readiness polling) and it must outlive the referee. If the player is
    # killed first, the referee's remaining instances score player_error — a zero the
    # submission did not earn.
    timeout_s: 1200
    http_api:
      port: 8000
      readiness_path: /health
      protocol: gym_v1

# The scorer sandbox: MuJoCo physics, the G1 model, the course, termination gates, scoring.
# No generate_round entrypoint: the suite is a pure function of the round input.
referee:
  protocol: gym_v1
  image:
    ref: ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-v2-referee
    digest: sha256:95d412adc45b062e417d86c34e7f309a0a59a9a45ed2f0433e5bde353294dc99
  timeout_s: 900

signature:
  cosign_identity: https://github.com/macrocosm-os/apex-competition-humanoid-parkour-v2/.github/workflows/release.yml
  cosign_issuer: https://token.actions.githubusercontent.com
