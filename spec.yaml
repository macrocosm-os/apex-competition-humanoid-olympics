schema: apex.competition.v1
id: humanoid_olympics
version: 0.2.0
display_name: "Humanoid Olympics"
kind: solo
process_type: cpu

# The referee holds one compiled G1 scene at a time, rather than six: event
# attempts are grouped by event and a 24-attempt meet stays within 2 GiB.
resources:
  cpu_limit: 2
  mem_limit: 2Gi
  gpu_count: 0

# DIGESTS BELOW ARE STALE: they are the v0.1.0 build, kept only so this file stays syncable until
# the v0.2.0 release run finishes. 0.2.0 changes the referee (env/sim.py), and changes it in a way
# that alters CONTACT PHYSICS rather than just a constant -- a 0.2.0 spec pointing at a 0.1.0
# referee would silently evaluate with three of the four friction strata still clamped to mu 1.0,
# which is the exact defect this release exists to fix and is invisible in the resulting scores.
# Re-pin both from the release run's job summary, resolve them from ghcr by tag, and verify with
# `cosign verify` (issuer = the GitHub OIDC endpoint, cert SAN = this file's `cosign_identity` at
# refs/tags/v0.2.0). The platform pins by digest and rejects tags.
image:
  ref: ghcr.io/macrocosm-os/apex-competition-humanoid-olympics-player
  digest: sha256:92e6aab7bfc511f1e6d107432cf1e368962c6fc716e1abd30ff8fbc1debea8a0

# A recurrent ONNX controller receives the same 104-float sensory contract as
# its predecessor and emits 12 joint-position targets plus 256 opaque state
# floats. The broad terrain preview now describes the active event's route.
submission:
  artifact_type: onnx
  max_size_mb: 15
  target_path: /app/submission.onnx

screening:
  max_size_mb: 15
  min_weight_bytes: 10000
  max_code_weight_ratio: 0.1

input_schema:
  $ref: ./input.schema.json

defaults:
  # Re-measured under 0.2.0's contact physics. 0.1.0's 0.032985375 was taken with three of the four
  # friction strata clamped to mu 1.0, so it described a grippier meet than the spec advertised.
  # Unlike humanoid_parkour, this is the MEASURED baseline rather than 0.0, so it is the platform's
  # entry bar and a physics change has to move it: 0.032985375 -> 0.032546083 (-1.33%). Still exact
  # across seeds (the launch meet is seed-neutral), so there is no standard error to stall round 1.
  baseline_score: 0.032546083
  baseline_raw_score: 0.032546083
  round_length_in_days: 2
  submission_reveal_days: 5
  lower_is_better: false

entrypoints:
  evaluate:
    command: ["python", "/app/launch.py", "--port", "8000"]
    network_disabled: false
    allow_internet: false
    # A four-attempt meet has at most 40,000 control calls. The referee's
    # internal 840-second budget leaves time to persist a result.
    timeout_s: 1200
    http_api:
      port: 8000
      readiness_path: /health
      protocol: gym_v1

referee:
  protocol: gym_v1
  image:
    ref: ghcr.io/macrocosm-os/apex-competition-humanoid-olympics-referee
    digest: sha256:2197d8bfd18196ad74e93a902860c4590caeefafcaa37c38af48a98edccc532b
  timeout_s: 900

signature:
  cosign_identity: https://github.com/macrocosm-os/apex-competition-humanoid-olympics/.github/workflows/release.yml@refs/tags/*
  cosign_issuer: https://token.actions.githubusercontent.com
