# Measure the baseline's raw score and round-to-round variance against the PUBLISHED images, on
# the same architecture the platform runs.
#
# Why this is a separate, manually-triggered workflow: `defaults.baseline_raw_score` in spec.yaml
# is the takeover floor, so it has to be measured where the platform will compute it. Two things
# move that number by more than the 1% takeover margin:
#
#   1. host vs image  — MuJoCo/onnxruntime dispatch on CPU features (measured ~1-3% apart)
#   2. arm64 vs amd64 — the release workflow runs on amd64, so the published images are amd64;
#                       measuring them under emulation on an arm64 laptop reproduces neither
#
# This job runs on an amd64 GitHub runner against the published digests, which removes both.
# Run it after a release, then copy `mean` into spec.yaml and commit the evidence JSON.
name: measure-baseline

on:
  workflow_dispatch:
    inputs:
      player_digest:
        description: "Player image digest (sha256:...) — defaults to the digest pinned in spec.yaml"
        required: false
      referee_digest:
        description: "Referee image digest (sha256:...) — defaults to the digest pinned in spec.yaml"
        required: false
      seeds:
        description: "Number of master seeds (>= 20 for the sizing evidence)"
        required: false
        default: "20"

permissions:
  contents: read
  packages: read

jobs:
  measure:
    runs-on: ubuntu-latest      # amd64, matching the release runner
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the digests to measure
        id: refs
        run: |
          BASE=ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-v2
          PD='${{ inputs.player_digest }}'
          RD='${{ inputs.referee_digest }}'
          # Default to whatever spec.yaml pins, so the evidence always describes the released spec.
          [ -n "$PD" ] || PD=$(grep -A2 '^image:' spec.yaml | awk '/digest:/{print $2; exit}')
          [ -n "$RD" ] || RD=$(awk '/^referee:/,0' spec.yaml | awk '/digest:/{print $2; exit}')
          echo "player=$BASE-player@$PD"   >> "$GITHUB_OUTPUT"
          echo "referee=$BASE-referee@$RD" >> "$GITHUB_OUTPUT"
          echo "Measuring:"; echo "  player  $BASE-player@$PD"; echo "  referee $BASE-referee@$RD"

      - name: Confirm the images are amd64
        run: |
          for img in '${{ steps.refs.outputs.player }}' '${{ steps.refs.outputs.referee }}'; do
            docker pull -q "$img"
            ARCH=$(docker image inspect "$img" --format '{{.Architecture}}')
            echo "$img -> $ARCH"
            [ "$ARCH" = "amd64" ] || { echo "::error::expected amd64, got $ARCH"; exit 1; }
          done

      - name: Measure ${{ inputs.seeds || 20 }} seeds at N=120
        env:
          PLAYER_IMAGE: ${{ steps.refs.outputs.player }}
          REFEREE_IMAGE: ${{ steps.refs.outputs.referee }}
        run: |
          ./tools/measure_variance_in_image.sh baseline/baseline.onnx "${{ inputs.seeds || 20 }}" \
            > variance_baseline_N120_amd64.json
          cat variance_baseline_N120_amd64.json

      - name: Compare against the spec's declared baseline_raw_score
        run: |
          python - <<'PY'
          import json, re, pathlib
          ev = json.load(open('variance_baseline_N120_amd64.json'))
          spec = pathlib.Path('spec.yaml').read_text()
          declared = float(re.search(r'baseline_raw_score:\s*([0-9.]+)', spec).group(1))
          mean, sigma = ev['mean'], ev['sigma_round']
          drift = abs(mean - declared) / declared * 100
          print(f"declared baseline_raw_score : {declared}")
          print(f"measured mean (amd64, image): {mean:.4f}")
          print(f"drift                       : {drift:.2f}%  (1% takeover margin)")
          print(f"sigma_round                 : {sigma:.4f}")
          print(f"sigma <= margin/4           : {ev['pass']}  ({ev['sigma_over_quarter_margin']:.1f}x)")
          summary = pathlib.Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          verdict = "matches" if drift <= 1.0 else "**DRIFTS BY MORE THAN THE TAKEOVER MARGIN**"
          summary.write_text(
              f"## Baseline measured on amd64, published images\n\n"
              f"| | |\n|---|---|\n"
              f"| declared in spec.yaml | `{declared}` |\n"
              f"| measured mean | `{mean:.4f}` |\n"
              f"| drift | {drift:.2f}% — {verdict} |\n"
              f"| sigma_round | `{sigma:.4f}` ({ev['sigma_over_quarter_margin']:.1f}x the quarter-margin) |\n\n"
              f"If the drift line is flagged, update `defaults.baseline_raw_score` to the measured mean.\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: variance-baseline-amd64
          path: variance_baseline_N120_amd64.json
