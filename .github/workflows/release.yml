# RELEASE WORKFLOW — builds, keyless-signs (cosign/OIDC), and pushes the hello_world
# player + referee images.
#
# The spec's `signature.cosign_identity` points at THIS file's path, so keep the path
# `.github/workflows/release.yml` and the repo name stable — changing either breaks the
# platform's signature verification at sync time.
#
# The images vendor the SDK (`player/gym_v1/`, `referee/gym_v1/`) and build FROM
# python:3.12-slim, so this workflow is self-contained — no base image or PyPI dependency.
# It is unverified in CI; run it on a tag once and confirm the Actions log before relying
# on it. REMAINING TODO after the first successful run: copy the pushed image digests into
# spec.yaml (`image.digest` and `referee.image.digest`), which are placeholder zeros today.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write            # required for keyless cosign signing

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: player,  dockerfile: player/Dockerfile }
          - { name: referee, dockerfile: referee/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and push
        id: build
        run: |
          IMAGE=ghcr.io/macrocosm-os/apex-competition-hello-world-${{ matrix.name }}
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.ref_name }}")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.digest }}"
