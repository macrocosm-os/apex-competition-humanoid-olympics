# RELEASE WORKFLOW — smoke-tests the evaluation loop, then builds, pushes, and keyless-signs
# (cosign/OIDC) the humanoid_parkour player + referee images.
#
# The spec's `signature.cosign_identity` points at THIS file's path, so keep the path
# `.github/workflows/release.yml` and the repo name stable — changing either breaks the
# platform's signature verification at sync time.
#
# The images vendor `gym_v1` (`player/gym_v1/`, `referee/gym_v1/`) and build FROM
# python:3.12-slim, so the image builds are self-contained: no base image and no toolkit
# dependency at build time. The toolkit is checked out for one purpose only — running
# `apex-dev preflight` in the smoke-test job — and is pinned to the same commit the vendored
# gym_v1 came from.
#
# After the first successful run, copy the digests from the job summary into spec.yaml
# (`image.digest` and `referee.image.digest`). The platform pins by digest and rejects tags.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write            # required for keyless cosign signing

env:
  # Same commit as the `# VENDORED from ... @ <sha>` header in player/gym_v1 and referee/gym_v1.
  TOOLKIT_REPO: macrocosm-os/apex-competitions-builder
  TOOLKIT_REF: d063d9028dbec4bb15182794496f4aa2aac19d49

jobs:
  # Spec validation needs the toolkit installed (apex-dev). It is a SEPARATE job from the loop
  # test on purpose: installing the toolkit puts `apex_sdk` on sys.path, which would mask a
  # broken vendored gym_v1 (a `from apex_sdk.gym_v1 ...` left in player/gym_v1 or referee/gym_v1
  # resolves from site-packages on the runner and then ImportErrors inside the image, where
  # apex_sdk does not exist). This repo shipped exactly that bug once.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check out the toolkit (pinned, for apex-dev only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLKIT_REPO }}
          ref: ${{ env.TOOLKIT_REF }}
          path: toolkit
      - run: python -m pip install --quiet ./toolkit
      - run: apex-dev preflight --spec spec.yaml --input fixtures/input.json

      # The vendored copies must match the toolkit commit they claim, and must not reference
      # apex_sdk — the one defect that is fatal in the image and invisible on the host.
      # The vendored copies must be the pinned toolkit's gym_v1 with the import root rewritten
      # and nothing else. Line 1-3 of each file is the VENDORED header (which mentions apex_sdk
      # by design), so both checks start at line 5.
      - name: Vendored gym_v1 matches the pinned toolkit
        run: |
          rc=0
          for d in player referee; do
            for f in toolkit/src/apex_sdk/gym_v1/*.py; do
              b=$(basename "$f")
              if tail -n +5 "$d/gym_v1/$b" | grep -q "apex_sdk"; then
                echo "::error file=$d/gym_v1/$b::still references apex_sdk; the vendored package must import top-level gym_v1"
                rc=1
              fi
              if ! diff -u <(tail -n +5 "$d/gym_v1/$b") \
                           <(perl -pe 's/\bapex_sdk\.gym_v1\b/gym_v1/g' "$f"); then
                echo "::error file=$d/gym_v1/$b::differs from toolkit $TOOLKIT_REF — re-vendor it"
                rc=1
              fi
            done
          done
          exit $rc

  # Gate the release on a real player+referee loop, WITHOUT the toolkit installed, so the
  # vendored gym_v1 is the only gym_v1 on sys.path — exactly the situation inside the images.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet mujoco==3.10.0 numpy==2.3.4 onnxruntime==1.28.0 onnx
      - name: apex_sdk must NOT be importable in this job
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("apex_sdk"):
              sys.exit("apex_sdk is installed — this job would mask a vendoring bug")
          print("ok: the vendored gym_v1 is the only gym_v1 on sys.path")
          PY

      - name: A synthetic policy scores through the full loop
        run: |
          python tools/make_test_policy.py --out /tmp/test_policy.onnx
          python tools/local_eval.py --onnx /tmp/test_policy.onnx --seed 0 \
            --courses-per-difficulty 1 --max-steps 200 | tee /tmp/eval.json
          # An untrained policy must produce a REAL evaluation: every course actually stepped
          # and terminated for a physics reason. `>= 0` would be vacuous (instance_score is
          # non-negative by construction), and player_error/invalid_action everywhere is how a
          # broken protocol looks.
          python - <<'PY'
          import json
          r = json.load(open('/tmp/eval.json'))
          bad = {'player_error', 'invalid_action'}
          reasons = [c['terminal_reason'] for c in r['metadata']['courses']]
          assert r['metadata']['num_courses'] == 3, r
          assert not (bad & set(reasons)), f"protocol broken, not just a weak policy: {reasons}"
          assert r['steps'] > 0, r
          print('ok:', reasons)
          PY

      - name: The baseline scores above zero (it seeds the leaderboard)
        run: |
          python tools/local_eval.py --onnx baseline/baseline.onnx --seed 0 \
            --courses-per-difficulty 2 --max-steps 900 | tee /tmp/baseline.json
          python -c "import json; r = json.load(open('/tmp/baseline.json')); assert r['raw_scores'][0] > 0, r"

  images:
    needs: [preflight, smoke-test]
    # Only tags produce pushed, signed images. A workflow_dispatch run on a branch would
    # otherwise publish and sign `:main`, and a signed image the spec never pins is a
    # liability, not a convenience.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: player,  dockerfile: player/Dockerfile }
          - { name: referee, dockerfile: referee/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and push
        id: build
        run: |
          IMAGE=ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-v2-${{ matrix.name }}
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.ref_name }}" | cut -d@ -f2)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}"
      # The platform pins by digest and rejects tags, so a released spec whose digests are
      # zeros (or stale) cannot sync. Say so loudly in the summary rather than let a maintainer
      # discover it at sync time.
      - name: Digest for spec.yaml
        run: |
          DIGEST='${{ steps.build.outputs.digest }}'
          {
            echo "### ${{ matrix.name }}"
            echo '```yaml'
            echo "ref: ${{ steps.build.outputs.image }}"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "$DIGEST" spec.yaml; then
            echo "spec.yaml already pins this ${{ matrix.name }} digest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::spec.yaml does not pin the ${{ matrix.name }} digest just built ($DIGEST). Commit it before requesting onboarding."
            echo "> :warning: **spec.yaml does not pin this digest yet** — commit it before requesting onboarding." >> "$GITHUB_STEP_SUMMARY"
          fi
