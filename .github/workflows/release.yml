# RELEASE WORKFLOW — smoke-tests the evaluation loop, then builds, pushes, and keyless-signs
# (cosign/OIDC) the humanoid_parkour player + referee images.
#
# The spec's `signature.cosign_identity` points at THIS file's path, so keep the path
# `.github/workflows/release.yml` and the repo name stable — changing either breaks the
# platform's signature verification at sync time.
#
# The images vendor `gym_v1` (`player/gym_v1/`, `referee/gym_v1/`) and build FROM
# python:3.12-slim, so the image builds are self-contained: no base image and no toolkit
# dependency at build time. The toolkit is checked out for one purpose only — running
# `apex-dev preflight` in the smoke-test job — and is pinned to the same commit the vendored
# gym_v1 came from.
#
# After the first successful run, copy the digests from the job summary into spec.yaml
# (`image.digest` and `referee.image.digest`). The platform pins by digest and rejects tags.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write            # required for keyless cosign signing

env:
  # Same commit as the `# VENDORED from ... @ <sha>` header in player/gym_v1 and referee/gym_v1.
  TOOLKIT_REPO: macrocosm-os/apex-competitions-builder
  TOOLKIT_REF: d063d9028dbec4bb15182794496f4aa2aac19d49

jobs:
  # Spec validation needs the toolkit installed (apex-dev). It is a SEPARATE job from the loop
  # test on purpose: installing the toolkit puts `apex_sdk` on sys.path, which would mask a
  # broken vendored gym_v1 (a `from apex_sdk.gym_v1 ...` left in player/gym_v1 or referee/gym_v1
  # resolves from site-packages on the runner and then ImportErrors inside the image, where
  # apex_sdk does not exist). This repo shipped exactly that bug once.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check out the toolkit (pinned, for apex-dev only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLKIT_REPO }}
          ref: ${{ env.TOOLKIT_REF }}
          path: toolkit
      - run: python -m pip install --quiet ./toolkit
      - run: apex-dev preflight --spec spec.yaml --input fixtures/input.json

      # The vendored copies must match the toolkit commit they claim, and must not reference
      # apex_sdk — the one defect that is fatal in the image and invisible on the host.
      # The vendored copies must be the pinned toolkit's gym_v1 with the import root rewritten
      # and nothing else. Line 1-3 of each file is the VENDORED header (which mentions apex_sdk
      # by design), so both checks start at line 5.
      - name: Vendored gym_v1 matches the pinned toolkit
        run: |
          rc=0
          for d in player referee; do
            for f in toolkit/src/apex_sdk/gym_v1/*.py; do
              b=$(basename "$f")
              if tail -n +5 "$d/gym_v1/$b" | grep -q "apex_sdk"; then
                echo "::error file=$d/gym_v1/$b::still references apex_sdk; the vendored package must import top-level gym_v1"
                rc=1
              fi
              if ! diff -u <(tail -n +5 "$d/gym_v1/$b") \
                           <(perl -pe 's/\bapex_sdk\.gym_v1\b/gym_v1/g' "$f"); then
                echo "::error file=$d/gym_v1/$b::differs from toolkit $TOOLKIT_REF — re-vendor it"
                rc=1
              fi
            done
          done
          exit $rc

  # Gate the release on a real player+referee loop, WITHOUT the toolkit installed, so the
  # vendored gym_v1 is the only gym_v1 on sys.path — exactly the situation inside the images.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet mujoco==3.11.0 numpy==2.3.4 onnxruntime==1.28.0 onnx torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: apex_sdk must NOT be importable in this job
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("apex_sdk"):
              sys.exit("apex_sdk is installed — this job would mask a vendoring bug")
          print("ok: the vendored gym_v1 is the only gym_v1 on sys.path")
          PY

      - name: A conforming policy is driven through real physics
        run: |
          PYTHONPATH=. python tools/make_test_policy.py --out /tmp/test_policy.onnx
          PYTHONPATH=. python tools/local_eval.py /tmp/test_policy.onnx -n 3 \
            --max-steps 200 -q --json /tmp/eval.json
          # An untrained policy must produce a REAL evaluation: every instance actually stepped
          # and terminated for a physics reason. `>= 0` would be vacuous (instance_score is
          # non-negative by construction), and player_error/invalid_action everywhere is how a
          # broken protocol looks, not how a weak policy looks.
          python - <<'PY'
          import json
          r = json.load(open('/tmp/eval.json'))
          bad = {'player_error', 'invalid_action'}
          reasons = [c['terminal_reason'] for c in r['instances']]
          assert r['n'] == 3, r
          assert not (bad & set(reasons)), f"protocol broken, not just a weak policy: {reasons}"
          assert sum(c['steps'] for c in r['instances']) > 0, r
          print('ok:', reasons)
          PY

      - name: The baseline scores above zero (it seeds the leaderboard)
        run: |
          PYTHONPATH=. python tools/local_eval.py baseline/baseline.onnx -n 4 \
            --max-steps 1200 -q --json /tmp/baseline.json
          python -c "import json; r=json.load(open('/tmp/baseline.json')); assert r['raw_score'] > 0, r; print('baseline raw_score', r['raw_score'])"

      # The suite must not depend on the round seed — that property is what makes
      # round-to-round variance zero and the 1% takeover margin meaningful (docs/design.md).
      - name: The evaluation suite is reproducible
        run: |
          PYTHONPATH=. python tools/local_eval.py baseline/baseline.onnx -n 4 \
            --max-steps 1200 -q --json /tmp/baseline2.json
          python - <<'PY'
          import json
          a = json.load(open('/tmp/baseline.json'))['raw_score']
          b = json.load(open('/tmp/baseline2.json'))['raw_score']
          assert a == b, f"suite is not reproducible: {a} != {b}"
          print('ok: reproducible at', a)
          PY

      # History is only worth writing if it still replays later, and the writer (env/history.py,
      # also used by the referee) and reader (tools/replay.py) are different files — so assert
      # the round trip, not just that recording ran.
      - name: A recorded run replays from its history files alone
        run: |
          PYTHONPATH=. python tools/local_eval.py baseline/baseline.onnx -n 2 \
            --max-steps 200 -q --json /tmp/norec.json
          PYTHONPATH=. python tools/local_eval.py baseline/baseline.onnx -n 2 \
            --max-steps 200 -q --json /tmp/rec.json --record /tmp/history
          python - <<'PY'
          import json
          # Recording must not perturb the run it is recording.
          a, b = (json.load(open(p)) for p in ('/tmp/norec.json', '/tmp/rec.json'))
          assert a['instances'] == b['instances'], "--record changed the scored result"
          assert b['history_files'] == 2, b.get('history_files')
          print('ok: identical with and without --record, raw_score', a['raw_score'])
          PY
          # One file per instance, named as the platform's FileType.HISTORY collector expects.
          test -f /tmp/history/instance_00.json && test -f /tmp/history/instance_01.json
          PYTHONPATH=. python tools/replay.py /tmp/history
          PYTHONPATH=. python - <<'PY'
          import mujoco, numpy as np
          from env.history import read_all
          from tools.preview import _lit_model
          from tools.replay import Run
          runs = [Run(r) for r in read_all('/tmp/history')]
          assert len(runs) == 2, len(runs)
          for run in runs:
              # The history has to reproduce the quantity the run was scored on.
              assert abs(float(run.qpos[:, 0].max()) - run.outcome['distance_m']) < 0.01, run.outcome
              assert run.action.shape == (run.frames, 12), run.action.shape
              # ...and rebuild the scene and pose with nothing but mujoco.
              model = _lit_model(run.frictions)
              data = mujoco.MjData(model)
              data.qpos[:] = run.qpos[-1]
              mujoco.mj_forward(model, data)
              assert np.isfinite(data.body('pelvis').xpos).all()
          print('ok: replayed', sum(r.frames for r in runs), 'frames from qpos alone')
          PY

      # The referee writes the history the miner actually receives, and logs every API call.
      # Both are exercised here without containers: the stub client calls the real player.
      - name: The referee writes per-instance history and the player logs every API call
        run: |
          PYTHONPATH=.:referee:player SUBMISSION_PATH=baseline/baseline.onnx python - <<'PY'
          import contextlib, io, pathlib
          import referee as ref
          from gym_v1.referee import RefereeContext
          from launch import ParkourPlayer
          from env.history import read_all

          N, STEPS = 3, 150
          ref.HISTORY_DIR = pathlib.Path('/tmp/refhistory')
          player = ParkourPlayer()
          assert player.is_ready(), player.load_error

          class Stub:
              def reset(self, **kw): player.reset(**kw)
              def act(self, observation, deadline_ms):
                  return player.act(observation=observation, deadline_ms=deadline_ms)

          ctx = RefereeContext(match_id='ci', seed=1, num_players=1, player_urls=['http://s'],
                               config={'num_instances': N, 'max_steps_per_episode': STEPS,
                                       'deadline_ms': 500})
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              result = ref.ParkourReferee().play_game(ctx, [Stub()])
          log = buf.getvalue()

          files = sorted(pathlib.Path('/tmp/refhistory').glob('*.json'))
          assert [p.name for p in files] == [f'instance_{i:02d}.json' for i in range(N)], files
          assert result.metadata['history_files'] == N, result.metadata
          for rec, row in zip(read_all('/tmp/refhistory'), result.metadata['instances']):
              assert rec['match_id'] == 'ci'
              assert rec['outcome']['score'] == row['score'], (rec['outcome'], row)

          acts = [l for l in log.splitlines() if l.startswith('apex.api') and ' call=act ' in l]
          resets = [l for l in log.splitlines() if ' call=reset ' in l]
          assert len(resets) == N, len(resets)
          assert len(acts) == sum(r['steps'] for r in result.metadata['instances']), len(acts)
          print(f'ok: {N} history files, {len(resets)} reset + {len(acts)} act lines logged')
          PY

      # A failure to write a debugging artifact must never turn a scored round into a zero.
      - name: An unwritable history directory does not fail the round
        run: |
          PYTHONPATH=.:referee:player SUBMISSION_PATH=baseline/baseline.onnx python - <<'PY'
          import contextlib, io, pathlib
          import referee as ref
          from gym_v1.referee import RefereeContext
          from launch import ParkourPlayer
          player = ParkourPlayer()

          class Stub:
              def reset(self, **kw): player.reset(**kw)
              def act(self, observation, deadline_ms):
                  return player.act(observation=observation, deadline_ms=deadline_ms)

          ctx = RefereeContext(match_id='ci', seed=1, num_players=1, player_urls=['http://s'],
                               config={'num_instances': 2, 'max_steps_per_episode': 100,
                                       'deadline_ms': 500})
          with contextlib.redirect_stdout(io.StringIO()):
              ref.HISTORY_DIR = pathlib.Path('/tmp/writable_history')
              ok = ref.ParkourReferee().play_game(ctx, [Stub()])
              ref.HISTORY_DIR = pathlib.Path('/proc/nope/history')
              bad = ref.ParkourReferee().play_game(ctx, [Stub()])
          assert ok.metadata['history_files'] == 2, ok.metadata     # the control really wrote
          assert bad.metadata['history_files'] == 0, bad.metadata
          assert bad.raw_scores == ok.raw_scores, (bad.raw_scores, ok.raw_scores)
          print('ok: unwritable history -> history_files=0, score unchanged at', ok.raw_scores[0])
          PY

  images:
    needs: [preflight, smoke-test]
    # Only tags produce pushed, signed images. A workflow_dispatch run on a branch would
    # otherwise publish and sign `:main`, and a signed image the spec never pins is a
    # liability, not a convenience.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: player,  dockerfile: player/Dockerfile }
          - { name: referee, dockerfile: referee/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and push
        id: build
        run: |
          IMAGE=ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-v2-${{ matrix.name }}
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.ref_name }}" | cut -d@ -f2)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}"
      # The platform pins by digest and rejects tags, so a released spec whose digests are
      # zeros (or stale) cannot sync. Say so loudly in the summary rather than let a maintainer
      # discover it at sync time.
      - name: Digest for spec.yaml
        run: |
          DIGEST='${{ steps.build.outputs.digest }}'
          {
            echo "### ${{ matrix.name }}"
            echo '```yaml'
            echo "ref: ${{ steps.build.outputs.image }}"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "$DIGEST" spec.yaml; then
            echo "spec.yaml already pins this ${{ matrix.name }} digest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::spec.yaml does not pin the ${{ matrix.name }} digest just built ($DIGEST). Commit it before requesting onboarding."
            echo "> :warning: **spec.yaml does not pin this digest yet** — commit it before requesting onboarding." >> "$GITHUB_STEP_SUMMARY"
          fi
